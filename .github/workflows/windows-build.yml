name: Build DZS SMART PoS EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install pkg
        run: npm install -g pkg

      - name: Build EXE
        run: pkg . --targets win64 --output dzs-smart-pos.exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: dzs-smart-pos-installer
          path: dzs-smart-pos.exe
